<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="savedBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </radialGradient>
    <linearGradient id="jacketSaved" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a532d" />
      <stop offset="100%" stop-color="#5c3418" />
    </linearGradient>
  </defs>
  <!-- Background Circle with emerald glow -->
  <circle cx="100" cy="100" r="95" fill="url(#savedBg)" stroke="#059669" stroke-width="3"/>
  
  <!-- Torso & Jacket -->
  <path d="M 45 195 Q 45 135 75 125 L 100 145 L 125 125 Q 155 135 155 195 Z" fill="url(#jacketSaved)" stroke="#3f2310" stroke-width="2"/>
  <polygon points="85,125 115,125 100,165" fill="#ffffff"/>
  <polygon points="97,135 103,135 105,170 100,178 95,170" fill="#059669"/>

  <!-- Head -->
  <rect x="90" y="110" width="20" height="20" rx="4" fill="#fcd3b2"/>
  <ellipse cx="100" cy="85" rx="36" ry="38" fill="#fcd3b2" stroke="#e09f67" stroke-width="1.5"/>
  <path d="M 64 80 C 64 50 80 40 100 40 C 120 40 136 50 136 80 C 130 65 115 55 100 55 C 82 55 70 65 64 80 Z" fill="#4a5568"/>

  <!-- Glasses -->
  <rect x="73" y="77" width="22" height="16" rx="4" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <rect x="105" y="77" width="22" height="16" rx="4" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <line x1="95" y1="84" x2="105" y2="84" stroke="#1a202c" stroke-width="2.5"/>

  <!-- Happy Eyes (curved arcs) -->
  <path d="M 78 86 Q 84 81 90 86" stroke="#1a202c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 110 86 Q 116 81 122 86" stroke="#1a202c" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Big Smile -->
  <path d="M 88 102 Q 100 114 112 102" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Shield Badge -->
  <circle cx="160" cy="40" r="24" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  <path d="M 152 40 L 158 46 L 169 34" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Saved Banner -->
  <rect x="50" y="176" width="100" height="18" rx="4" fill="#059669"/>
  <text x="100" y="189" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">BILL EST SAUVÉ !</text>
</svg>
