<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="billBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3f6" />
      <stop offset="100%" stop-color="#eae7eb" />
    </radialGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a532d" />
      <stop offset="100%" stop-color="#5c3418" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#billBg)" stroke="#d1cfc7" stroke-width="3"/>
  
  <!-- Torso & Jacket -->
  <path d="M 45 195 Q 45 135 75 125 L 100 145 L 125 125 Q 155 135 155 195 Z" fill="url(#jacketGrad)" stroke="#3f2310" stroke-width="2"/>
  
  <!-- Shirt & Tie -->
  <polygon points="85,125 115,125 100,165" fill="url(#shirtGrad)"/>
  <polygon points="97,135 103,135 105,170 100,178 95,170" fill="#dc2626"/>
  <!-- Jacket Collar Lapels -->
  <path d="M 75 125 L 90 155 L 72 170 Z" fill="#6d3c1a"/>
  <path d="M 125 125 L 110 155 L 128 170 Z" fill="#6d3c1a"/>

  <!-- Neck -->
  <rect x="90" y="110" width="20" height="20" rx="4" fill="#fcd3b2"/>

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="36" ry="38" fill="#fcd3b2" stroke="#e09f67" stroke-width="1.5"/>

  <!-- Hair -->
  <path d="M 64 80 C 64 50 80 40 100 40 C 120 40 136 50 136 80 C 130 65 115 55 100 55 C 82 55 70 65 64 80 Z" fill="#4a5568"/>
  <path d="M 62 82 Q 66 65 82 54" stroke="#2d3748" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <circle cx="63" cy="88" r="8" fill="#fcd3b2" stroke="#e09f67" stroke-width="1.5"/>
  <circle cx="137" cy="88" r="8" fill="#fcd3b2" stroke="#e09f67" stroke-width="1.5"/>

  <!-- Glasses -->
  <rect x="73" y="77" width="22" height="16" rx="4" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <rect x="105" y="77" width="22" height="16" rx="4" fill="none" stroke="#1a202c" stroke-width="2.5"/>
  <line x1="95" y1="84" x2="105" y2="84" stroke="#1a202c" stroke-width="2.5"/>
  <line x1="65" y1="83" x2="73" y2="83" stroke="#1a202c" stroke-width="2"/>
  <line x1="127" y1="83" x2="135" y2="83" stroke="#1a202c" stroke-width="2"/>

  <!-- Eyes behind glasses -->
  <circle cx="84" cy="85" r="3.5" fill="#1a202c"/>
  <circle cx="85.5" cy="83.5" r="1.2" fill="#ffffff"/>
  <circle cx="116" cy="85" r="3.5" fill="#1a202c"/>
  <circle cx="117.5" cy="83.5" r="1.2" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 74 72 Q 84 69 92 73" stroke="#2d3748" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 108 73 Q 116 69 126 72" stroke="#2d3748" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Nose & Mouth -->
  <path d="M 98 90 Q 100 95 103 93" stroke="#d97706" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 92 104 Q 100 110 108 104" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Name tag badge -->
  <rect x="74" y="178" width="52" height="14" rx="3" fill="#1e293b"/>
  <text x="100" y="188" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">BILL // VIP</text>
</svg>
