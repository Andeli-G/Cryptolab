<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <radialGradient id="nightSpot" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#291002" />
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Backdrop -->
  <rect x="0" y="0" width="240" height="180" rx="8" fill="url(#nightSpot)"/>

  <!-- Streetlamp subtle beam cone -->
  <polygon points="120,0 40,180 200,180" fill="#fef08a" opacity="0.08"/>

  <!-- Ground surface line -->
  <line x1="10" y1="140" x2="230" y2="140" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Shadow under the empty coat -->
  <ellipse cx="120" cy="142" rx="65" ry="14" fill="#020617" opacity="0.8" filter="url(#shadowFilter)"/>

  <!-- The Abandoned Coat on the Ground -->
  <!-- Left Sleeve folded -->
  <path d="M 68 135 C 55 130 50 142 65 146 C 78 149 90 140 85 133 Z" fill="#5c2605" stroke="#291002" stroke-width="1.5"/>

  <!-- Coat Body (draped, empty) -->
  <path d="M 80 132 C 90 115 110 112 125 114 C 145 112 165 120 160 136 C 158 144 140 148 120 147 C 98 147 75 142 80 132 Z" fill="url(#coatGrad)" stroke="#1c0a00" stroke-width="1.5"/>

  <!-- Lapel / Collar fold -->
  <path d="M 112 114 L 118 132 L 128 122 L 136 124" stroke="#854d0e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Right Sleeve extending outward -->
  <path d="M 155 132 C 172 134 185 140 180 145 C 170 148 152 144 146 138 Z" fill="#5c2605" stroke="#291002" stroke-width="1.5"/>

  <!-- Dropped Glasses next to the coat -->
  <ellipse cx="185" cy="138" rx="6" ry="4.5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="198" cy="139" rx="6" ry="4.5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="191" y1="138" x2="192" y2="139" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Dramatic Cinematic Tape & Badge -->
  <rect x="55" y="20" width="130" height="22" rx="4" fill="#dc2626" fill-opacity="0.9" stroke="#ef4444" stroke-width="1"/>
  <text x="120" y="35" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">CIBLE COMPROMISE</text>

  <text x="120" y="168" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-style="italic">
    Conséquence narrative : Bill n'a pas pu être secouru à temps
  </text>
</svg>
